name: pos_offline
description: A modern offline POS application with Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.2
  shared_preferences: ^2.2.2

  # CSV
  csv: ^5.1.1

  # Image
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # Barcode
  barcode_widget: ^2.0.4
  flutter_barcode_scanner:
    ^2.0.0

  # Permission Handler
  permission_handler: ^11.1.0

  # Path Provider
  path_provider: ^2.1.1
  file_picker: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: CustomIcons
  #     fonts:
  #       - asset: assets/fonts/CustomIcons.ttf
